name: UI 组件定时维护
on:
  workflow_dispatch:
  schedule:
    # UTC 00:00 对应北京时间 08:00，GitHub 排队可能造成延迟。
    - cron: '0 0 * * *'
permissions:
  contents: read
concurrency:
  group: ui-vault-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vault
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: apps/vault/package-lock.json
      - run: npm ci
      - run: node scripts/build-parser.mjs
      - run: google-chrome --version
      - name: 采集、隔离编译并写入组件库
        run: node scripts/sync-cloud.mjs
        env:
          VAULT_SITE_URL: ${{ vars.VAULT_SITE_URL }}
          VAULT_SITE_SERVICE_TOKEN: ${{ secrets.VAULT_SITE_SERVICE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_SYNC_MAX_ATTEMPTS: ${{ vars.VAULT_SYNC_MAX_ATTEMPTS || '60' }}
